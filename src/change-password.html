<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ganti Password</title>

    <link rel="stylesheet" href="./output.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <div class="max-w-xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Ganti Password</h1>

        <a href="account.html" class="text-gray-500"> ← Kembali </a>
      </div>

      <div class="bg-white rounded-3xl border border-gray-200 p-6">
        <div class="space-y-4">
          <div>
            <label class="block text-sm mb-2"> Password Lama </label>

            <input
              id="oldPassword"
              type="password"
              class="w-full border border-gray-200 rounded-xl px-4 py-3"
            />
          </div>

          <div>
            <label class="block text-sm mb-2"> Password Baru </label>

            <input
              id="newPassword"
              type="password"
              class="w-full border border-gray-200 rounded-xl px-4 py-3"
            />
          </div>

          <div>
            <label class="block text-sm mb-2"> Konfirmasi Password Baru </label>

            <input
              id="confirmPassword"
              type="password"
              class="w-full border border-gray-200 rounded-xl px-4 py-3"
            />
          </div>

          <button
            onclick="changePassword()"
            class="w-full bg-black text-white py-4 rounded-2xl"
          >
            Simpan Password
          </button>
        </div>
      </div>
    </div>

    <!-- POPUP -->

    <div
      id="popupOverlay"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"
    >
      <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center">
        <div id="popupIcon" class="text-5xl mb-4">✅</div>

        <h2 id="popupTitle" class="text-2xl font-bold mb-2">Berhasil</h2>

        <p id="popupMessage" class="text-gray-500 mb-6">Pesan</p>

        <button
          id="popupButton"
          class="w-full bg-black text-white py-3 rounded-2xl"
        >
          Oke
        </button>
      </div>
    </div>

    <script src="change-password.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
