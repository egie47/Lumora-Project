<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lumora</title>

    <link rel="stylesheet" href="./output.css" />

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <!-- HEADER -->

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto p-4">
        <div
          class="flex flex-col md:flex-row gap-4 justify-between items-center"
        >
          <!-- LOGO -->

          <div>
            <h1 class="text-2xl font-bold">Lumora</h1>

            <p id="welcomeText" class="text-sm text-gray-500">Halo</p>
          </div>

          <!-- ACTION -->

          <div class="flex gap-2 w-full md:w-auto">
            <!-- SEARCH -->

            <input
              id="searchInput"
              type="text"
              placeholder="Cari produk..."
              class="h-11 px-4 border border-gray-200 rounded-xl w-full md:w-72"
            />

            <!-- CART -->

            <button
              onclick="goToCart()"
              class="w-11 h-11 bg-white border border-gray-200 rounded-xl hover:bg-gray-100 transition"
            >
              <iconify-icon
                icon="mdi:cart"
                width="20"
                height="25"
              ></iconify-icon>
            </button>

            <!-- ACCOUNT -->

            <button
              onclick="goToAccount()"
              class="w-11 h-11 bg-white border border-gray-200 rounded-xl hover:bg-gray-100 transition"
            >
              <iconify-icon
                icon="mdi:account"
                width="20"
                height="25"
              ></iconify-icon>
            </button>

            <!-- LOGOUT -->

            <button
              onclick="openLogoutModal()"
              class="h-11 px-5 bg-white border border-gray-200 rounded-xl hover:bg-red-50 hover:text-red-500 transition"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->

    <div class="max-w-7xl mx-auto p-6">
      <!-- CATEGORY -->

      <div class="mb-8">
        <h2 class="font-semibold mb-4">Kategori</h2>

        <div class="flex gap-3 overflow-x-auto pb-2">
          <button
            id="all"
            onclick="filterCategory('all')"
            class="category-btn bg-black text-white border border-gray-200 px-5 py-2 rounded-xl whitespace-nowrap transition"
          >
            Semua
          </button>

          <button
            id="electronics"
            onclick="filterCategory('electronics')"
            class="category-btn bg-white border border-gray-200 px-5 py-2 rounded-xl whitespace-nowrap hover:bg-gray-100 transition"
          >
            Electronics
          </button>

          <button
            id="jewelery"
            onclick="filterCategory('jewelery')"
            class="category-btn bg-white border border-gray-200 px-5 py-2 rounded-xl whitespace-nowrap hover:bg-gray-100 transition"
          >
            Jewelery
          </button>

          <button
            id="men's clothing"
            onclick="filterCategory(`men's clothing`)"
            class="category-btn bg-white border border-gray-200 px-5 py-2 rounded-xl whitespace-nowrap hover:bg-gray-100 transition"
          >
            Men's
          </button>

          <button
            id="women's clothing"
            onclick="filterCategory(`women's clothing`)"
            class="category-btn bg-white border border-gray-200 px-5 py-2 rounded-xl whitespace-nowrap hover:bg-gray-100 transition"
          >
            Women's
          </button>
        </div>
      </div>

      <!-- PRODUCT INFO -->

      <div class="flex justify-between items-center mb-4">
        <h2 class="font-semibold text-lg">Produk</h2>

        <p id="productCount" class="text-sm text-gray-500">0 Produk</p>
      </div>

      <!-- PRODUCT GRID -->

      <div
        id="productList"
        class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"
      >
        <!-- CARD -->

        <div
          class="group relative bg-white rounded-2xl border border-gray-200 p-4 overflow-hidden cursor-pointer hover:shadow-2xl hover:-translate-y-1 transition-all duration-300"
        >
          <!-- OVERLAY -->

          <div
            class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center gap-3 z-10"
          >
            <!-- BUTTON CART -->

            <button
              class="h-11 px-4 rounded-xl bg-white text-black font-medium hover:bg-gray-200 transition"
            >
              Keranjang
            </button>

            <!-- BUTTON DETAIL -->

            <button
              class="h-11 px-4 rounded-xl border border-white text-white hover:bg-white hover:text-black transition"
            >
              Detail
            </button>
          </div>

          <!-- IMAGE -->

          <img
            src="https://fakestoreapi.com/img/81fPKd-2AYL._AC_SL1500_.jpg"
            class="w-full h-40 object-contain mb-4"
          />

          <!-- TITLE -->

          <h2 class="text-sm font-medium line-clamp-2 h-10 mb-2">
            Fjallraven Backpack
          </h2>

          <!-- CATEGORY -->

          <p class="text-xs text-gray-400 capitalize mb-3">men's clothing</p>

          <!-- FOOTER -->

          <div class="flex justify-between items-center">
            <p class="font-semibold">Rp 1.200.000</p>

            <div class="flex items-center gap-1 text-yellow-500 text-sm">
              <iconify-icon
                icon="material-symbols:star-rounded"
                width="18"
                height="18"
              ></iconify-icon>

              <span>4.8</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- LOADING -->

    <div
      id="loading"
      class="fixed inset-0 bg-white flex items-center justify-center z-50 hidden"
    >
      <div class="text-center">
        <div
          class="w-12 h-12 border-4 border-gray-200 border-t-black rounded-full animate-spin mx-auto mb-4"
        ></div>

        <p>Memuat Produk...</p>
      </div>
    </div>

    <!-- CART POPUP -->

    <div
      id="cartPopup"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[999] p-4"
    >
      <div class="bg-white w-full max-w-sm rounded-3xl p-6">
        <!-- ICON -->

        <div
          class="w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4"
        >
          <iconify-icon
            icon="solar:cart-large-2-bold"
            class="text-[34px]"
          ></iconify-icon>
        </div>

        <!-- TEXT -->

        <h2 class="text-xl font-semibold text-center mb-2">
          Berhasil Ditambahkan
        </h2>

        <p class="text-sm text-gray-500 text-center mb-6">
          Produk berhasil masuk ke keranjang
        </p>

        <!-- BUTTON -->

        <div class="flex gap-3">
          <!-- CONTINUE -->

          <button
            onclick="closeCartPopup()"
            class="flex-1 h-12 rounded-2xl border border-gray-200 hover:bg-gray-50 transition"
          >
            Lanjut Belanja
          </button>

          <!-- GO CART -->

          <button
            onclick="goToCartPage()"
            class="flex-1 h-12 rounded-2xl bg-black text-white hover:opacity-90 transition"
          >
            Lihat Keranjang
          </button>
        </div>
      </div>
    </div>

    <!-- LOGOUT MODAL -->

    <div
      id="logoutModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-[999] p-4"
    >
      <div class="bg-white w-full max-w-sm rounded-3xl p-6">
        <!-- ICON -->

        <div
          class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4"
        >
          <iconify-icon
            icon="solar:logout-2-bold"
            class="text-red-500 text-[34px]"
          ></iconify-icon>
        </div>

        <!-- TEXT -->

        <h2 class="text-xl font-semibold text-center mb-2">Logout?</h2>

        <p class="text-sm text-gray-500 text-center mb-6">
          Kamu yakin ingin keluar dari akun ini?
        </p>

        <!-- BUTTON -->

        <div class="flex gap-3">
          <button
            onclick="closeLogoutModal()"
            class="flex-1 h-12 rounded-2xl border border-gray-200 hover:bg-gray-50 transition"
          >
            Batal
          </button>

          <button
            onclick="logout()"
            class="flex-1 h-12 rounded-2xl bg-red-500 text-white hover:bg-red-600 transition"
          >
            Logout
          </button>
        </div>
      </div>
    </div>

    <script src="home.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
