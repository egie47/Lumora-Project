<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login — Lumora</title>

    <link rel="stylesheet" href="./output.css" />

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body
    class="relative bg-gray-100 min-h-screen flex items-center justify-center p-6"
  >
    <a
      href="index.html"
      class="absolute top-6 left-6 flex items-center gap-2 px-4 py-2 rounded-xl hover:bg-gray-50 transition"
    >
      ← Kembali
    </a>

    <div
      class="bg-white w-full max-w-md rounded-3xl border border-gray-200 p-8"
    >
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold mb-2">Lumora</h1>

        <p class="text-gray-500">Login untuk melanjutkan belanja</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2"> Email </label>

          <input
            id="email"
            type="email"
            placeholder="nama@email.com"
            class="w-full h-12 px-4 border border-gray-200 rounded-xl focus:outline-none focus:border-black"
          />
        </div>

        <div>
          <label class="block text-sm font-medium mb-2"> Password </label>

          <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            class="w-full h-12 px-4 border border-gray-200 rounded-xl focus:outline-none focus:border-black"
          />
        </div>

        <div class="flex justify-between items-center text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="showPassword" />

            <span> Tampilkan Password </span>
          </label>

          <a href="register.html" class="font-medium hover:underline">
            Daftar
          </a>
        </div>

        <button
          type="submit"
          class="w-full h-12 bg-black text-white rounded-xl hover:opacity-90 transition"
        >
          Login
        </button>
      </form>

      <div class="mt-8 text-center text-sm text-gray-500">
        Belum punya akun?

        <a href="register.html" class="text-black font-medium hover:underline">
          Daftar sekarang
        </a>
      </div>
    </div>

    <!-- POPUP -->

    <div
      id="popupOverlay"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-3xl p-8 max-w-sm w-full text-center animate-fade"
      >
        <!-- ICON -->

        <div class="mb-4 flex justify-center">
          <div
            class="w-24 h-24 rounded-3xl bg-green-100 flex items-center justify-center"
          >
            <iconify-icon
              id="popupIcon"
              icon="ph:check-fill"
              class="text-[52px] text-green-500"
            ></iconify-icon>
          </div>
        </div>

        <!-- TITLE -->

        <h2 id="popupTitle" class="text-2xl font-bold mb-2">Berhasil</h2>

        <!-- MESSAGE -->

        <p id="popupMessage" class="text-gray-500 mb-6">Pesan</p>

        <!-- BUTTON -->

        <button
          id="popupButton"
          class="w-full bg-black text-white py-3 rounded-2xl hover:opacity-90 transition-all duration-300"
        >
          Oke
        </button>
      </div>
    </div>

    <script>
      const showPassword = document.getElementById("showPassword");

      const passwordInput = document.getElementById("password");

      showPassword.addEventListener("change", function () {
        passwordInput.type = this.checked ? "text" : "password";
      });
    </script>

    <script src="./auth.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
