<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Detail Produk — Tokoko</title>

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link rel="stylesheet" href="./output.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100">
    <!-- WRAPPER -->
    <div class="max-w-7xl mx-auto p-6">
      <!-- TOP BAR -->
      <div class="flex justify-between items-center mb-6">
        <a
          href="./homepage.html"
          class="text-sm text-gray-500 hover:text-black"
        >
          ← Kembali
        </a>

        <div class="flex gap-3">
          <button
            onclick="goCart()"
            class="bg-white border border-gray-200 rounded-xl px-4 py-2 flex items-center gap-2 hover:bg-gray-50 transition"
          >
            <iconify-icon
              icon="solar:cart-large-2-bold"
              class="text-[20px]"
            ></iconify-icon>

            <span>Keranjang</span>
          </button>

          <a
            href="account.html"
            class="bg-white border border-gray-200 rounded-xl px-4 py-2 flex items-center gap-2 hover:bg-gray-50 transition"
          >
            <iconify-icon
              icon="solar:user-bold"
              class="text-[20px]"
            ></iconify-icon>

            <span>Akun</span>
          </a>
        </div>
      </div>

      <!-- DETAIL -->
      <div
        id="detail"
        class="bg-white rounded-3xl border border-gray-200 p-6"
      ></div>

      <!-- REKOMENDASI -->
      <div class="mt-10">
        <h2 class="text-xl font-semibold mb-5">Produk Serupa</h2>

        <div
          id="recommendationList"
          class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"
        ></div>
      </div>
    </div>

    <!-- CART SUCCESS -->
    <div
      id="successOverlay"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-3xl p-8 max-w-sm w-full text-center animate-fade"
      >
        <!-- ICON -->

        <div class="mb-4 flex justify-center">
          <div
            class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center"
          >
            <iconify-icon
              icon="solar:cart-large-2-bold"
              class="text-[42px]"
            ></iconify-icon>
          </div>
        </div>

        <!-- TITLE -->

        <h2 class="text-2xl font-bold mb-2">Berhasil Ditambahkan</h2>

        <!-- DESC -->

        <p class="text-gray-500 text-sm mb-8">
          Produk berhasil masuk ke keranjang
        </p>

        <!-- BUTTON -->

        <div class="flex gap-3 mt-6">
          <button
            onclick="closeSuccessOverlay()"
            class="flex-1 h-12 rounded-2xl border border-gray-200"
          >
            Lanjut Belanja
          </button>

          <button
            onclick="goCart()"
            class="flex-1 h-12 rounded-2xl bg-black text-white"
          >
            Lihat Keranjang
          </button>
        </div>
      </div>
    </div>

    <!-- WISHLIST SUCCESS -->
    <div
      id="wishlistOverlay"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-3xl p-8 max-w-sm w-full text-center animate-fade"
      >
        <div class="mb-4 flex justify-center">
          <div
            class="w-20 h-20 rounded-full bg-red-100 flex items-center justify-center"
          >
            <iconify-icon
              icon="solar:heart-bold"
              class="text-[42px] text-red-500"
            ></iconify-icon>
          </div>
        </div>

        <h2 class="text-2xl font-bold mb-2">Wishlist Ditambahkan</h2>

        <p class="text-gray-500 text-sm mb-6">Produk berhasil masuk wishlist</p>

        <button
          onclick="closeWishlistOverlay()"
          class="w-full bg-black text-white py-3 rounded-2xl hover:opacity-90 transition"
        >
          Oke
        </button>
      </div>
    </div>

    <script src="./detail.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
