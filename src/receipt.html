<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Invoice Pembayaran</title>

    <link rel="stylesheet" href="./output.css" />

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .receipt-card {
        animation: pop 0.4s ease;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
      <div
        id="receipt"
        class="bg-white rounded-3xl border border-gray-200 p-8 receipt-card"
      ></div>

      <div class="grid md:grid-cols-2 gap-3 mt-6">
        <button
          onclick="goHistory()"
          class="bg-white border border-gray-200 py-4 rounded-2xl hover:bg-gray-50"
        >
          Riwayat Transaksi
        </button>

        <button
          onclick="goHome()"
          class="bg-black text-white py-4 rounded-2xl hover:opacity-90"
        >
          Homepage
        </button>
      </div>
    </div>

    <script src="./receipt.js"></script>
  </body>
</html>
