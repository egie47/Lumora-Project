<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout — Tokoko</title>

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link rel="stylesheet" href="./output.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .fade-in {
        animation: fade 0.3s ease;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: scale(0.95);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
      <!-- HEADER -->

      <div class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold">Checkout</h1>

        <a href="./cart.html" class="text-sm text-gray-500 hover:text-black">
          ← Kembali
        </a>
      </div>

      <!-- PRODUCT -->

      <div id="checkoutList" class="space-y-4 mb-6"></div>

      <!-- PAYMENT -->

      <div class="bg-white rounded-3xl border border-gray-200 p-6 mb-6">
        <h2 class="font-semibold text-lg mb-5">Metode Pembayaran</h2>

        <div class="space-y-3">
          <!-- QRIS -->

          <label
            class="flex items-center justify-between border border-gray-200 rounded-2xl p-4 cursor-pointer hover:bg-gray-50 transition-all duration-300"
          >
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 flex items-center justify-center">
                <iconify-icon
                  icon="solar:qr-code-bold"
                  class="text-[24px]"
                ></iconify-icon>
              </div>

              <div>
                <h3 class="font-medium">QRIS</h3>

                <p class="text-sm text-gray-400">Scan QR untuk membayar</p>
              </div>
            </div>

            <input
              type="radio"
              name="payment"
              value="QRIS"
              checked
              class="w-5 h-5 accent-black"
            />
          </label>

          <!-- DEBIT -->

          <label
            class="flex items-center justify-between border border-gray-200 rounded-2xl p-4 cursor-pointer hover:bg-gray-50 transition-all duration-300"
          >
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 flex items-center justify-center">
                <iconify-icon
                  icon="solar:card-bold"
                  class="text-[24px]"
                ></iconify-icon>
              </div>

              <div>
                <h3 class="font-medium">Debit Card</h3>

                <p class="text-sm text-gray-400">Visa / Mastercard</p>
              </div>
            </div>

            <input
              type="radio"
              name="payment"
              value="Debit Card"
              class="w-5 h-5 accent-black"
            />
          </label>

          <!-- CASH -->

          <label
            class="flex items-center justify-between border border-gray-200 rounded-2xl p-4 cursor-pointer hover:bg-gray-50 transition-all duration-300"
          >
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 flex items-center justify-center">
                <iconify-icon
                  icon="solar:wallet-money-bold"
                  class="text-[24px]"
                ></iconify-icon>
              </div>

              <div>
                <h3 class="font-medium">Cash</h3>

                <p class="text-sm text-gray-400">Bayar di tempat</p>
              </div>
            </div>

            <input
              type="radio"
              name="payment"
              value="Cash"
              class="w-5 h-5 accent-black"
            />
          </label>
        </div>
      </div>

      <!-- TOTAL -->

      <div class="bg-white rounded-3xl border border-gray-200 p-6">
        <!-- VOUCHER -->

        <div class="mb-6">
          <p class="font-medium mb-3">Voucher</p>

          <div class="flex flex-col sm:flex-row gap-3">
            <input
              id="voucherInput"
              placeholder="Masukkan kode voucher"
              class="flex-1 border border-gray-200 rounded-2xl px-4 py-3 outline-none"
            />

            <button
              onclick="applyVoucher()"
              class="bg-black text-white px-6 py-3 rounded-2xl whitespace-nowrap"
            >
              Pakai
            </button>
          </div>

          <p id="voucherInfo" class="text-sm text-green-600 mt-2 hidden">
            Voucher digunakan
          </p>
        </div>

        <!-- TOTAL PRICE -->

        <div class="flex justify-between items-center mb-6">
          <span class="text-gray-500"> Total Tagihan </span>

          <span id="grandTotal" class="text-3xl font-bold"> Rp0 </span>
        </div>

        <!-- BUTTON -->

        <button
          onclick="payNow()"
          class="w-full bg-black text-white py-4 rounded-2xl hover:opacity-90 transition"
        >
          Bayar Sekarang
        </button>
      </div>
    </div>

    <!-- QRIS MODAL -->

    <div
      id="qrisModal"
      class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4"
    >
      <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center fade-in">
        <h2 class="text-2xl font-bold mb-2">QRIS Payment</h2>

        <p class="text-sm text-gray-500 mb-5">
          Scan QR menggunakan e-wallet atau mobile banking
        </p>

        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=TokokoPayment"
          class="w-64 h-64 mx-auto mb-5 rounded-xl"
        />

        <!-- STATUS -->

        <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 mb-4">
          <p class="text-xs text-gray-500 mb-1">Status Pembayaran</p>

          <p id="paymentStatus" class="font-semibold text-yellow-600">
            Menunggu Pembayaran
          </p>
        </div>

        <!-- COUNTDOWN -->

        <div class="bg-gray-100 rounded-2xl py-4 mb-6">
          <p class="text-xs text-gray-500 mb-1">Batas Waktu Pembayaran</p>

          <p id="countdown" class="text-3xl font-bold">05:00</p>
        </div>

        <!-- BUTTON -->

        <div class="flex gap-3">
          <button
            onclick="closeQris()"
            class="flex-1 border py-3 rounded-xl hover:bg-gray-100"
          >
            Batal
          </button>

          <button
            onclick="simulatePayment()"
            class="flex-1 bg-black text-white py-3 rounded-xl hover:opacity-90"
          >
            Saya Sudah Bayar
          </button>
        </div>
      </div>
    </div>

    <!-- LOADING MODAL -->

    <div
      id="loadingModal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-3xl p-10 text-center fade-in">
        <div
          class="w-14 h-14 border-4 border-gray-200 border-t-black rounded-full spin mx-auto mb-5"
        ></div>

        <h2 class="text-xl font-semibold mb-2">Memproses Pembayaran...</h2>

        <p class="text-gray-400 text-sm">Mohon tunggu sebentar</p>
      </div>
    </div>

    <script src="./checkout.js"></script>

    <script src="./theme.js"></script>
  </body>
</html>
