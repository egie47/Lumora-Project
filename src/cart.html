<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang — Tokoko</title>

    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

    <link rel="stylesheet" href="./output.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100 pb-36">
    <div class="max-w-6xl mx-auto p-6">
      <!-- HEADER -->
      <div class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-semibold">Keranjang</h1>

        <a
          href="./homepage.html"
          class="text-sm text-gray-500 hover:text-black"
        >
          ← Kembali
        </a>
      </div>

      <!-- LIST -->
      <div id="cartList" class="space-y-4"></div>
    </div>

    <!-- STICKY CHECKOUT -->
    <div
      class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4"
    >
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div>
          <p class="text-sm text-gray-400">Total</p>

          <h2 id="totalPrice" class="text-2xl font-bold">$0</h2>
        </div>

        <button
          onclick="goCheckout()"
          class="bg-black text-white px-8 py-4 rounded-2xl hover:opacity-90 transition"
        >
          Checkout
        </button>
      </div>
    </div>

    <script src="./cart.js"></script>
  </body>
</html>
